[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdview"
version = "0.1.0"
description = "Console Markdown viewer with less-like navigation"
authors = [
  { name = "Matt Heck", email = "mheck@hardproblemsgroup.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "prompt_toolkit==3.0.52",
  "rich==15.0.0"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Text Processing :: Markup",
  "Topic :: Utilities"
]

[project.optional-dependencies]
interactive = [
  "prompt_toolkit==3.0.52"
]
dev = [
  "black==26.3.1",
  "pytest==9.0.3",
  "pytest-timeout==2.4.0",
  "ruff==0.15.12"
]

[project.scripts]
mdview = "mdview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py39"]
