[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdview"
version = "0.1.0"
description = "Console Markdown viewer with less-like navigation"
authors = [
  { name = "Matt Heck", email = "mheck@hardproblemsgroup.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "prompt_toolkit>=3.0",
  "rich>=13.7.0"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Text Processing :: Markup",
  "Topic :: Utilities"
]

[project.optional-dependencies]
interactive = [
  "prompt_toolkit>=3.0"
]
dev = [
  "black>=24.0",
  "pytest>=7.4",
  "ruff>=0.6.0"
]

[project.scripts]
mdview = "mdview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
