# mdview system defaults
# Copy to /etc/mdview/mdview.conf for sitewide settings.
# Copy to ~/.config/mdview/mdview.conf for user overrides.

# [ui]
# theme = auto
# wrap_column = 0

# [pager]
# command =
# follow_stdin = false

# [rendering]
# normalize_newlines = true
# link_handling = inline
# syntax_highlighting = true

# [files]
# default_paths =
# trust_remote = false
